name: Menü

# Menü sayfasını okur, değişiklik varsa data dalına yazar ve GitHub Pages'te yayınlar.
on:
  schedule:
    # UTC. Türkiye saatiyle hafta içi 07:17-18:17 her saat, hafta sonu 10:43 ve 18:43.
    - cron: "17 4-15 * * 1-5"
    - cron: "43 7,15 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# İki koşu aynı anda data dalına yazmasın.
concurrency:
  group: menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Menüyü oku
        run: ./gradlew -q -p robot run --args="$GITHUB_WORKSPACE/data"

      - name: Değişikliği kaydet
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update menu"
          git push

      # Yayındaki kopyayla karşılaştırılır; yarıda kalan bir yayın sonraki koşuda tamamlanır.
      - name: Yayın güncel mi
        id: live
        run: |
          # Zamanlanmış koşularda olay verisi farklı olduğu için depo adı ortamdan alınır.
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --max-time 30 -o live.json "$BASE/v1/archive.json" || true
          if cmp -s live.json data/v1/archive.json; then echo "fresh=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.live.outputs.fresh != 'true'
        with:
          path: data

      - uses: actions/deploy-pages@v5
        if: steps.live.outputs.fresh != 'true'
        id: deploy

      # GitHub, 60 gün hareketsiz depolarda zamanlanmış işleri kapatır (ör. yaz tatili).
      - name: Zamanlamayı açık tut
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable menu.yml --repo "$GITHUB_REPOSITORY"
