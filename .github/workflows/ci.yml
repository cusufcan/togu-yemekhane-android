name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Aynı dalda yeni push gelirse eski koşuyu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Robot testleri
        run: ./gradlew -p robot test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Testler, lint ve debug APK
        run: ./gradlew test lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raporlar
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
