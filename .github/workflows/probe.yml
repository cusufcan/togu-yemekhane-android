name: Kaynak erişim denemesi

# GitHub makinelerinin menü sayfasına ulaşabildiğini elle denemek için.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Menü sayfasını iste
        run: |
          curl -sS --max-time 60 -o page.html \
            -w 'status=%{http_code} bytes=%{size_download} time=%{time_total}s\n' \
            https://sosyaltesisler.gop.edu.tr/yemekhane_menu.aspx
          grep -o 'ContentPlaceHolder1_hafta[A-Za-z]*"[^>]*>[^<]*' page.html
