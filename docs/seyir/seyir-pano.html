<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOGÜ Yemekhane Panosu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EFEBF3;--fg:#1D1A21;--mute:#5A5164;--line:#D6CFDD;--ctl:#FCF8FF}
@media (prefers-color-scheme:dark){:root{--bg:#0E0C10;--fg:#E7E0EE;--mute:#A99FB4;--line:#3A3243;--ctl:#1B171F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px Inter,system-ui,sans-serif;padding:32px 16px 48px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.page{max-width:1640px;margin:auto}
h1{font:700 28px/32px Inter,sans-serif;margin:0 0 8px}
.intro{max-width:65ch;color:var(--mute);margin:0}
.ctls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 32px}
.grp{display:flex;gap:4px;background:var(--ctl);border:1px solid var(--line);border-radius:24px;padding:4px}
.grp button{min-height:36px;padding:0 14px;border-radius:18px;font-weight:600;font-size:13px}
.grp button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:40px 24px}
figure{margin:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{width:100%;max-width:360px;order:-1}
figcaption b{display:block;font-size:14px;line-height:18px}
figcaption span{font-size:12px;line-height:17px;color:var(--mute)}
figure .grp{align-self:center}

/* Seyir rolleri: telefon kendi temasını taşır */
.phone{--p:#6200EE;--op:#FFF;--pc:#EDDCFF;--opc:#22005D;--s:#7C6299;--sc:#DECAF1;--su:#FCF8FF;--on:#1D1A21;--low:#F7F2FB;--c:#F1ECF5;--h:#ECE6F1;--v:#4F4559;--ol:#7F7389;--olv:#D6CFDD;--sel:#644789;--osel:#FFF;--pos:#DCECE2;--opos:#22604D;--warm:#F4E7DA;--owarm:#78502F}
.phone.dark{--p:#DBB8FF;--op:#381E72;--pc:#3C245B;--opc:#EDDCFF;--s:#AA96BF;--sc:#4D336E;--su:#151218;--on:#E7E0EE;--low:#1B171F;--c:#221E27;--h:#2B2630;--v:#CDC2D8;--ol:#978CA3;--olv:#50445D;--sel:#DBB8FF;--osel:#381E72;--pos:#203A30;--opos:#B7DEC9;--warm:#3B2B22;--owarm:#EDC7AA}
.yesil .phone{--p:#2C6A3F;--pc:#CFEFD3;--opc:#07210F;--s:#55725B;--sc:#D3E8D5;--su:#F8FBF5;--on:#1A1D19;--low:#F1F6EE;--c:#EBF1E8;--h:#E5ECE2;--v:#434D43;--ol:#737D72;--olv:#CBD4C9;--sel:#2F6B44}
.yesil .phone.dark{--p:#A6DBAE;--op:#0B3919;--pc:#1F4A2C;--opc:#CFEFD3;--s:#93AE97;--sc:#2F5138;--su:#111411;--on:#E2E6DF;--low:#171B17;--c:#1E231E;--h:#272D27;--v:#C2CABF;--ol:#8C968A;--olv:#434B42;--sel:#A6DBAE;--osel:#0B3919}

.phone{width:100%;max-width:360px;height:780px;border-radius:40px;padding:5px;background:#332F37;border:1px solid #BCB2C5}
.in{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--su);color:var(--on);transition:background-color .18s,color .18s}
.status{position:absolute;inset:0 0 auto;height:38px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font:600 12px/17px Inter,system-ui,sans-serif;z-index:2}
.status i{width:20px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1px}
.gest{position:absolute;bottom:6px;left:50%;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:var(--on);opacity:.75;z-index:3}
.scr{position:absolute;inset:38px 0 78px;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:none}
.nav{position:absolute;inset:auto 0 0;height:78px;padding:6px 16px 18px;display:flex;background:var(--h);border-top:1px solid var(--olv)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px/15px Inter,system-ui,sans-serif;color:var(--v);padding-top:4px}
.nav span{width:48px;height:26px;border-radius:13px;display:grid;place-items:center}
.nav .on{color:var(--on);font-weight:700}.nav .on span{background:var(--pc);color:var(--opc)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.top{display:flex;align-items:center;gap:8px}
.top>div{flex:1;min-width:0}
.top h2{margin:0;font:700 28px/32px Inter,system-ui,sans-serif}
.sub{font-size:12px;line-height:17px;color:var(--v)}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--v);margin-right:-8px}
.days{display:flex;background:var(--c);border-radius:28px;padding:4px}
.days button{flex:1;min-height:52px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--v);font:500 11px/15px Inter,system-ui,sans-serif;transition:background-color .18s,color .18s}
.days b{font:700 16px/20px Inter,system-ui,sans-serif;color:var(--on)}
.days [aria-pressed=true]{background:var(--sel);color:var(--osel)}
.days [aria-pressed=true] b{color:inherit}
.days .td::after{content:"";width:4px;height:4px;border-radius:2px;background:currentColor;margin-top:-1px}
.eyebrow{font:700 11px/15px Inter,system-ui,sans-serif}
.hero{background:var(--pc);color:var(--opc);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:8px;min-height:148px}
.hero h3{margin:0;font:700 32px/36px Inter,system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance;flex:1}
.hero .k{font:600 14px/20px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.card{background:var(--c);border-radius:20px;padding:16px}
.rows{padding:4px 16px}
.rows>div{min-height:48px;display:flex;align-items:center;gap:12px;font-size:16px;line-height:23px;padding:8px 0}
.rows>div+div{border-top:1px solid var(--olv)}
.rows .g{margin-left:auto;color:var(--v);font-size:12px;line-height:17px;text-align:right}
.veg{background:var(--pos);color:var(--opos);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:64px}
.veg b{display:block;font:600 16px/23px Inter,system-ui,sans-serif}.veg span{font-size:12px;line-height:17px}
.fresh{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;line-height:17px;color:var(--v);padding-top:2px}
.fresh svg{width:15px;height:15px}
.wk{display:flex;gap:14px;background:var(--c);border-radius:20px;padding:13px 16px;min-height:88px;align-items:center;width:100%}
.wk.now{background:var(--pc);color:var(--opc)}
.wk .d{width:36px;text-align:center;flex:none;font:500 11px/15px Inter,system-ui,sans-serif}.wk .d b{display:block;font:700 23px/28px Inter,system-ui,sans-serif}
.wk .m{flex:1;min-width:0}.wk .m b{display:block;font:600 16px/23px Inter,system-ui,sans-serif}
.wk .m span{font-size:12px;line-height:17px;color:var(--v);display:block}.wk.now .m span{color:inherit}
.ctr{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px}
.ctr .ic{width:56px;height:56px;border-radius:28px;background:var(--pc);color:var(--opc);display:grid;place-items:center}
.ctr .ic svg{width:26px;height:26px}
.ctr h3{margin:0;font:700 32px/36px Inter,system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.ctr p{margin:0;font-size:16px;line-height:23px;color:var(--v)}
.btn{min-height:48px;padding:0 24px;border-radius:24px;background:var(--p);color:var(--op);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.t{background:var(--sc);color:var(--on)}
.warn{background:var(--warm);color:var(--owarm);border-radius:20px;padding:16px;display:flex;gap:12px}
.warn b{display:block;font:600 16px/23px Inter,system-ui,sans-serif}.warn p{margin:2px 0 0;font-size:14px;line-height:20px}
.sk{background:var(--c);border-radius:20px;animation:sk 1.1s ease-in-out infinite alternate}
@keyframes sk{to{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}
.seg{display:flex;background:var(--h);border-radius:24px;padding:4px;margin-top:10px}
.seg button{flex:1;min-height:40px;border-radius:20px;text-align:center;font-weight:500;color:var(--v)}
.seg [aria-pressed=true]{background:var(--sel);color:var(--osel);font-weight:600}
.lb{font:600 14px/18px Inter,system-ui,sans-serif}
.sw{width:52px;height:32px;border-radius:16px;background:var(--olv);position:relative;flex:none;transition:background-color .18s}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:10px;background:var(--su);transition:transform .18s}
.sw[aria-checked=true]{background:var(--p)}.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--op)}
.rw{display:flex;align-items:center;gap:12px;min-height:48px}.rw>div{flex:1;min-width:0}
.time{font:700 28px/32px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;min-height:48px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--olv);margin-top:8px;padding-top:8px;width:100%}
.home{background:var(--sc)}.home .scr{inset:38px 0 18px;justify-content:space-between}
.nt{background:var(--su);border-radius:28px;padding:16px;display:flex;gap:12px}
.ap{width:36px;height:36px;border-radius:18px;background:var(--p);color:var(--op);display:grid;place-items:center;flex:none}
.nt b{display:block;font:600 14px/18px Inter,system-ui,sans-serif;margin-top:2px}.nt p{margin:2px 0 0;color:var(--v)}
.wd{background:var(--su);border-radius:28px;padding:18px 20px}
.wd h3{font:700 23px/28px Inter,system-ui,sans-serif;margin:4px 0}.wd p{margin:0;color:var(--v)}
.wd .sub{display:flex;justify-content:space-between}
.dock{display:flex;justify-content:space-around;padding-bottom:20px}.dock i{width:52px;height:52px;border-radius:26px;background:var(--su);opacity:.55}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="today" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9M17 21v-7m0 0c-2 0-3-2-3-5.500S15.300 3 17 3v11Z"/></symbol>
<symbol id="week" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v5M16 3v5m-8 6h2m4 0h2m-8 3h2"/></symbol>
<symbol id="set" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="ref" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.400-5.700L20 8.500M20 4v4.500h-4.500"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-9 5-14 15-14 0 10-5 14-11 14-2 0-4-1-4-3m0 4c2-5 5-8 9-10"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 5-1 6-2 7h16c-1-1-2-2-2-7m-8 10a2 2 0 0 0 4 0"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="off" viewBox="0 0 24 24"><path d="M4 4l16 16M5 10a11 11 0 0 1 4-2m4-.4A11 11 0 0 1 19 10M8 14a6 6 0 0 1 4-1.500M12 18h.01"/></symbol>
</svg>
<div class="page">
<h1>TOGÜ Yemekhane</h1>
<p class="intro">Seyir ile mockup panosu. Menüler 23–27 Kasım 2026 haftasının gerçek verisi. Gün seçici, ayarlar, “Tekrar dene” ve ekran altındaki durum seçiciler çalışır; diğer düğmeler görüntüdür.</p>
<div class="ctls">
<div class="grp" data-ctl="pal" role="group" aria-label="Renk"><button data-v="mor" aria-pressed="true">Seyir moru</button><button data-v="yesil" aria-pressed="false">TOGÜ yeşili</button></div>
<div class="grp" data-ctl="tema" role="group" aria-label="Tema"><button data-v="karma" aria-pressed="true">Karma</button><button data-v="acik" aria-pressed="false">Hepsi açık</button><button data-v="koyu" aria-pressed="false">Hepsi koyu</button></div>
</div>
<div class="board" id="board"></div>
</div>
<script>
const W=[["Pzt","Pazartesi",23,["Ezogelin çorba","Hasanpaşa köfte","Bulgur pilavı","Çikolatalı puding"],"Patates graten",1056],
["Sal","Salı",24,["Toyga çorba","Körili tavuk","Mısırlı pirinç pilavı","Meyve"],"Mantar sote",977],
["Çar","Çarşamba",25,["Domates çorba","Kıymalı yumurtalı ıspanak","Makarna","Yoğurt"],"Pırasa yemeği",989],
["Per","Perşembe",26,["Ispanak çorba","Macar gulaş","Mercimekli bulgur pilavı","Un helvası"],"Yoğurtlu makarna salatası",1072],
["Cum","Cuma",27,["Aşçıbaşı çorba","Fırında patatesli soslu but","Nohutlu pirinç pilavı","Mevsim salata"],"Bamya yemeği",984]];
const i=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const nav=a=>`<div class="nav">${[["today","Bugün"],["week","Hafta"],["set","Ayarlar"]].map(([n,l],k)=>`<div class="${k===a?"on":""}"><span>${i(n)}</span>${l}</div>`).join("")}</div>`;
const top_=(t,s,btn=true)=>`<div class="top"><div><h2>${t}</h2><div class="sub">${s}</div></div>${btn?`<button class="ib" aria-label="Yenile">${i("ref")}</button>`:""}</div>`;
const today=(sel=0)=>{const d=W[sel],[c,m,...r]=d[3];return `<div class="scr">${top_(sel?d[1]:"Bugün",`${d[2]} Kasım${sel?"":" "+d[1]}`)}
<div class="days" role="group" aria-label="Gün">${W.map((x,k)=>`<button data-day="${k}" aria-pressed="${k===sel}" class="${k?"":"td"}">${x[0]}<b>${x[2]}</b></button>`).join("")}</div>
<div class="hero"><div class="eyebrow">Ana yemek</div><h3>${m}</h3><div class="k">Menü toplamı ${d[5].toLocaleString("tr-TR")} kcal</div></div>
<div class="card rows"><div>${c}</div>${r.map(x=>`<div>${x}</div>`).join("")}</div>
<div class="veg">${i("leaf")}<div><span>Vejetaryen seçenek</span><b>${d[4]}</b></div></div>
<div class="fresh">${i("clock")}Bugün 08.12'de güncellendi</div></div>${nav(0)}`};
const wk=(d,now)=>`<div class="wk ${now?"now":""}"><div class="d">${d[0]}<b>${d[2]}</b></div><div class="m"><b>${d[3][1]}</b><span>${[d[3][0],...d[3].slice(2)].join(", ")}</span></div></div>`;
const week=()=>`<div class="scr">${top_("Hafta","23–27 Kasım")}${W.map((d,k)=>wk(d,!k)).join("")}<div class="fresh">${i("clock")}Bugün 08.12'de güncellendi</div></div>${nav(1)}`;
const none=k=>`<div class="scr">${top_("Bugün",k?"28 Kasım Cumartesi":"25 Kasım Çarşamba")}<div class="ctr"><div class="ic">${i("today")}</div><h3>${k?"Hafta sonu menü yok":"Bugün için menü yok"}</h3><p>${k?"Yeni haftanın menüsü yayınlanınca burada görünecek.":"Sayfada bugüne ait yemek yok. Tatil olabilir."}</p><button class="btn t">${k?"Biten haftaya bak":"Haftanın kalanına bak"}</button></div></div>${nav(0)}`;
const stale=()=>`<div class="scr">${top_("Bugün","30 Kasım Pazartesi")}<div class="warn">${i("off")}<div><b>Bu haftanın menüsü alınamadı</b><p>İnternet gelince kendiliğinden yenilenir. Aşağıdaki menü geçen haftanın.</p></div></div><div class="eyebrow" style="padding:8px 4px 0">Son indirilen: 23–27 Kasım</div>${W.map(d=>wk(d)).join("")}</div>${nav(0)}`;
const first=k=>k?`<div class="scr">${top_("Bugün","23 Kasım Pazartesi",false)}<div class="ctr"><div class="ic">${i("off")}</div><h3>Menü alınamadı</h3><p>İnternet bağlantını kontrol et. Menü bir kez indikten sonra internetsiz de açılır.</p><button class="btn" data-retry>${i("ref")}Tekrar dene</button></div></div>${nav(0)}`
:`<div class="scr" aria-label="Yükleniyor">${top_("Bugün","23 Kasım Pazartesi",false)}<div class="sk" style="height:60px;border-radius:28px"></div><div class="sk" style="height:148px;border-radius:28px"></div><div class="sk" style="height:152px"></div><div class="sk" style="height:64px"></div></div>${nav(0)}`;
const seg=(o,s)=>`<div class="seg">${o.map((x,k)=>`<button data-seg aria-pressed="${k===s}">${x}</button>`).join("")}</div>`;
const sett=()=>`<div class="scr">${top_("Ayarlar","",false)}
<div class="card"><div class="rw"><div><div class="lb">Menü hatırlatıcısı</div><div class="sub">Menü olmayan günlerde gelmez</div></div><button class="sw" role="switch" aria-checked="true" aria-label="Menü hatırlatıcısı"></button></div><button class="time">11.30${i("next")}</button></div>
<div class="card"><div class="lb">Tema</div>${seg(["Sistem","Açık","Koyu"],0)}</div>
<div class="card"><div class="lb">Dil</div>${seg(["Sistem","English","Türkçe"],0)}</div>
<div class="card rows"><div>Menü kaynağı<span class="g">sosyaltesisler<wbr>.gop.edu.tr</span></div><div>Sürüm<span class="g">2.0.0</span></div></div>
<div class="sub" style="padding:0 4px">Bağımsız bir uygulamadır, üniversitenin resmî uygulaması değildir. Yemek adları kaynaktaki gibi gösterilir.</div></div>${nav(2)}`;
const home=()=>`<div class="scr"><div class="nt"><div class="ap">${i("today")}</div><div><div class="sub">Yemekhane · 11.30</div><b>Bugün: Hasanpaşa köfte</b><p>Ezogelin çorba, bulgur pilavı, çikolatalı puding</p></div></div>
<div><div class="wd"><div class="sub"><span>23 Kasım Pazartesi</span><span>1.056 kcal</span></div><h3>Hasanpaşa köfte</h3><p>Ezogelin çorba<br>Bulgur pilavı<br>Çikolatalı puding</p></div></div><div class="dock"><i></i><i></i><i></i><i></i></div></div>`;
const S=[["1 · Bugün","Ana yemek tek bakışta. Gün seçici bugünden açılır.",()=>today()],
["2 · Hafta","Beş gün tek ekranda. Güne dokununca o günün menüsü açılır.",week],
["3 · Menü yok","Hafta sonu ve tatil ayrı metin alır.",none,["Tatil","Hafta sonu"],1],
["4 · İnternet yok, yeni hafta","Eski menü bugünün menüsü gibi gösterilmez.",stale],
["5 · İlk açılış","Yükleme ve hata. “Tekrar dene” çalışır.",first,["Yükleniyor","Hata"],1],
["6 · Ayarlar","Hatırlatıcı saati, tema, dil, kaynak.",sett],
["7 · Bildirim ve widget","Yerel hatırlatıcı (2. dilim) ve widget (3. dilim).",home],
["8 · Bugün, koyu","Aynı ekran, koyu tema.",()=>today()]];
const B=document.getElementById("board");
B.innerHTML=S.map((s,k)=>`<figure data-k="${k}"><figcaption><b>${s[0]}</b><span>${s[1]}</span></figcaption><div class="phone"><div class="in ${k===6?"home":""}"><div class="status"><span>${k===6?"11.30":"12.04"}</span><i></i></div><div class="body">${s[2](s[4])}</div><div class="gest"></div></div></div>${s[3]?`<div class="grp" role="group" aria-label="Durum">${s[3].map((x,j)=>`<button data-st="${j}" aria-pressed="${j===s[4]}">${x}</button>`).join("")}</div>`:""}</figure>`).join("");
const press=b=>[...b.parentElement.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
const theme=m=>B.querySelectorAll(".phone").forEach((p,k)=>p.classList.toggle("dark",m==="koyu"||(m==="karma"&&k===7)));
theme("karma");
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 const f=b.closest("figure"),body=f&&f.querySelector(".body");
 if(b.dataset.v){press(b);const c=b.parentElement.dataset.ctl;c==="pal"?document.body.classList.toggle("yesil",b.dataset.v==="yesil"):theme(b.dataset.v)}
 else if(b.dataset.day){const d=+b.dataset.day;body.innerHTML=today(d);body.querySelector(`[data-day="${d}"]`).focus({focusVisible:false})}
 else if(b.dataset.st){press(b);body.innerHTML=S[+f.dataset.k][2](+b.dataset.st)}
